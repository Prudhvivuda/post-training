apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: team-b-lora-workbench
  namespace: team-b-lora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp3-csi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: team-b-lora-workbench
  namespace: team-b-lora
  annotations:
    notebooks.opendatahub.io/inject-auth: "true"
    notebooks.opendatahub.io/last-image-selection: "pytorch:3.5"
    opendatahub.io/accelerator-name: "NVIDIA"
    opendatahub.io/image-display-name: "PyTorch 3.5 CUDA"
    opendatahub.io/username: "pvuda@redhat.com"
    openshift.io/description: "Team B one-GPU LoRA fine-tuning workbench"
    openshift.io/display-name: "Team B LoRA Workbench"
spec:
  template:
    spec:
      enableServiceLinks: false
      tolerations:
        # dev06 GPU workers are intentionally tainted; these tolerate only the
        # existing NVIDIA worker pools, not unrelated or control-plane nodes.
        - key: g5-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: g6e-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: team-b-lora-workbench
          image: registry.redhat.io/rhoai/odh-workbench-jupyter-pytorch-cuda-py312-rhel9@sha256:f476e56ad00faaad5f2e26010f633233db2d4b299d7c5281e2f4ac46949b531b
          imagePullPolicy: IfNotPresent
          workingDir: /opt/app-root/src
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/team-b-lora/team-b-lora-workbench
                --ServerApp.quit_button=False
                --ServerApp.tornado_settings={"user":"pvuda@redhat.com","hub_host":"https://rhods-dashboard-redhat-ods-applications.apps.ai-dev06.kni.syseng.devcluster.openshift.com","hub_prefix":"/projects/team-b-lora"}
            - name: JUPYTER_IMAGE
              value: registry.redhat.io/rhoai/odh-workbench-jupyter-pytorch-cuda-py312-rhel9@sha256:f476e56ad00faaad5f2e26010f633233db2d4b299d7c5281e2f4ac46949b531b
            - name: PIP_CERT
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: PIPELINES_SSL_SA_CERTS
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: GIT_SSL_CAINFO
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /notebook/team-b-lora/team-b-lora-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /notebook/team-b-lora/team-b-lora-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /opt/app-root/src
              name: team-b-lora-workbench
            - mountPath: /dev/shm
              name: shm
            - mountPath: /etc/pki/tls/custom-certs/ca-bundle.crt
              name: trusted-ca
              readOnly: true
              subPath: ca-bundle.crt
      volumes:
        - name: team-b-lora-workbench
          persistentVolumeClaim:
            claimName: team-b-lora-workbench
        - name: shm
          emptyDir:
            medium: Memory
        - name: trusted-ca
          configMap:
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
            name: workbench-trusted-ca-bundle
            optional: true
